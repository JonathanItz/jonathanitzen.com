<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan Itzen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/dist/main.css">
    <link rel="stylesheet" href="/dist/app.css">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <!-- <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script> -->

    <script src="https://cdn.jsdelivr.net/npm/animejs/lib/anime.iife.min.js"></script>

    <script>
    const { animate } = anime;
    </script>
</head>

<body class="app__root min-h-screen text-white bg-black" x-data>
    <header
    x-init="
        setTimeout(() => {
            $el.classList.remove('opacity-0')
        }, 1000)
    "
    class="
    fixed top-1/2 -translate-y-1/2 left-4 flex flex-col gap-1 opacity-0 transition-opacity duration-1500 ease-in
    rounded-xl border border-slate-800 p-1 bg-black/40 backdrop-blur-[2px] shadow-inner
    "
    x-data="{
        text: false,
        defaultWidth: 42,
        width: 115,
        over() {
            animate($el, {
                width: this.width + 'px',
                duration: 400,
                onComplete: () => {
                    this.text = true
                },
            });
        },
        out() {
            this.text = false

            animate($el, {
                width: this.defaultWidth + 'px',
                duration: 400,
                delay: 200
            });
        },
    }"
    x-on:mouseenter="over"
    x-on:mouseleave="out"
    >
        <a
        href="#"
        x-on:click.prevent="scrollToElement('#home')"
        z-tooltip="Home" class="text-sm font-medium flex items-center gap-2 hover:bg-stone-900/80 transition-colors rounded-lg p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>       
            <span
            x-transition.opacity.duration.150ms
            x-transition:leave.opacity.duration.150ms
            x-show="text"
            >Home</span>
        </a>
        <a
        href="#"
        x-on:click.prevent="scrollToElement('#about')"
        z-tooltip="About me" class="text-sm font-medium flex items-center gap-2 hover:bg-stone-900/80 transition-colors rounded-lg p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-signature-icon lucide-signature"><path d="m21 17-2.156-1.868A.5.5 0 0 0 18 15.5v.5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1c0-2.545-3.991-3.97-8.5-4a1 1 0 0 0 0 5c4.153 0 4.745-11.295 5.708-13.5a2.5 2.5 0 1 1 3.31 3.284"/><path d="M3 21h18"/></svg>
            <span
            x-transition.opacity.duration.150ms
            x-transition:leave.opacity.duration.150ms
            x-show="text"
            >About me</span>
        </a>
        <a
        href="#"
        x-on:click.prevent="scrollToElement('#work')"
        z-tooltip="My work" class="text-sm font-medium flex items-center gap-2 hover:bg-stone-900/80 transition-colors rounded-lg p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-briefcase-business-icon lucide-briefcase-business"><path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M22 13a18.15 18.15 0 0 1-20 0"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
            <span
            x-transition.opacity.duration.150ms
            x-transition:leave.opacity.duration.150ms
            x-show="text"
            >My work</span>
        </a>
    </header>

    <section id="home" class="grid place-items-center h-full w-full min-h-screen">
        <h1 class="text-4xl font-thin">Jonathan Itzen</h1>
    </section>

    <section id="about" class="grid place-items-center h-full w-full min-h-screen pt-24">
        <div class="space-y-8">
            <h2 class="text-4xl font-thin text-center">About me</h2>
            <div class="font-thin tracking-wide max-w-xl">
                <p>Hello.</p>
                <p>I'm Jon.</p>
                <p>Senior Full Stack Web Developer.</p>
                <p>I enjoy rock climbing, biking, reading, programming, playing games and hanging out with friends.</p>
            </div>

            <div class="max-w-xl space-y-8">
                <img src="/static/images/2.JPG" alt="" class="rounded-xl">
                <div class="grid grid-cols-2 gap-8">
                    <img src="/static/images/1.JPG" alt="" class="rounded-xl">
                    <img src="/static/images/3.jpeg" alt="" class="rounded-xl">
                    <img src="/static/images/4.jpeg" alt="" class="rounded-xl">
                    <img src="/static/images/5.jpeg" alt="" class="rounded-xl">
                    <img src="/static/images/6.JPG" alt="" class="rounded-xl">
                    <img src="/static/images/7.JPG" alt="" class="rounded-xl">
                </div>
            </div>
        </div>
    </section>

    <section id="work" class="grid place-items-center h-full w-full min-h-screen pt-24">
        <h2 class="text-4xl font-thin">My Work</h2>
    </section>

    <!-- Stars -->
    <canvas class="app__canvas"></canvas>
    <div class="app__canvasDimensions"></div>
    
    <script src="/dist/main.js"></script>

    <script>
        document.addEventListener('alpine:init', () => {
            // Magic: $tooltip
            Alpine.magic('tooltip', el => message => {
                let instance = tippy(el, { content: message, trigger: 'manual' })
    
                instance.show()
    
                setTimeout(() => {
                    instance.hide()
    
                    setTimeout(() => instance.destroy(), 150)
                }, 2000)
            })
    
            // Directive: x-tooltip
            Alpine.directive('tooltip', (el, { expression }) => {
                tippy(el, {
                    content: expression,
                    placement: 'right',
                })
            })
        })

        function scrollToElement(element, duration = 1000) {
            const target = typeof element === 'string' ? document.querySelector(element) : element;
            if (!target) return;
          
            const start = window.pageYOffset;
            const end = target.getBoundingClientRect().top + start;
            const distance = end - start;
            const startTime = performance.now();
          
            function animate(currentTime) {
              const timeElapsed = currentTime - startTime;
              const progress = Math.min(timeElapsed / duration, 1);
              const easeInOut = progress < 0.5
                ? 2 * progress * progress
                : -1 + (4 - 2 * progress) * progress;
          
              window.scrollTo(0, start + distance * easeInOut);
          
              if (timeElapsed < duration) {
                requestAnimationFrame(animate);
              }
            }
          
            requestAnimationFrame(animate);
        }
    </script>
</body>

</html>
